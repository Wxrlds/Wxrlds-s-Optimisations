# Used when a commit is pushed to the repository
# This makes use of caching for faster builds and uploads the resulting artifacts
# Reference https://github.com/CaffeineMC/sodium/blob/dc7dc4c634316ac8b510d2dc8290079ebc462778/.github/workflows/build-commit.yml
name: build-commit

on:
  push:
    branches:
      - '**' # All branches so this does not get triggered, when pushing tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Pakku
        run: curl -L -o pakku.jar https://github.com/juraj-hrivnak/Pakku/releases/download/v1.3.2/pakku.jar

      - name: Export modpack
        run: java -jar pakku.jar export

      - name: Extract current branch name
        id: get_branch
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          echo "branch=${ref////-}" >> $GITHUB_OUTPUT

      - name: Upload Curseforge Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wxrldssoptimisations-cf-artifacts-${{ steps.get_branch.outputs.branch }}
          path: build/curseforge/*.zip

      - name: Upload Modrinth Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wxrldssoptimisations-mr-artifacts-${{ steps.get_branch.outputs.branch }}
          path: build/modrinth/*.mrpack
